# Orion CI — one workflow to test, build, and deploy.
#
# Test jobs never gate the build/deploy jobs, so a red test never blocks a deploy
# (detection, not prevention; branch protection isn't available on this private repo):
#   unit              — flutter test (unit + widget)
#   web-e2e           — headless web integration_test suite (scripts/web/e2e.sh)
#   web / apk         — branch builds (staging + previews), auto
#   web-prod / apk-prod — tag builds (prod root), behind a manual approval gate
#
# Deploy targets (one Caddy serves a single static tree over HTTPS — see
# scripts/dev/remote/edge/):
#   Prod:    push a version tag `v*`             -> /web/         and /apk/    (GATED)
#   Staging: push to `main`                      -> /web/staging/ and /apk/staging/
#   Preview: push to `feature/**` or `dev/**`    -> /web/<slot>/  and /apk/<slot>/
#            (`feature/` is stripped; other refs keep their path, e.g.
#             dev/testing -> /web/dev/testing/). `main` maps to the reserved
#             `staging` slot and is deployed exactly like a preview leaf.
#
# The prod jobs declare `environment: production` — GitHub's native required-reviewer
# gate, created by scripts/dev/local/edge/setup-github.sh. Approve the run in the repo
# UI to release.
#
# Required GitHub config (Settings → Secrets and variables → Actions):
#   Secret    VPS_SSH_KEY   private half of the CI deploy key
#   Variables VPS_HOST / VPS_USER / VPS_PORT
# Deploy root on the VPS: /root/orion/site/{web,apk}/  (served by Caddy).

name: ci

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'dev/**'
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  # Per-branch: a new push supersedes an in-flight run of the same branch only.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Tests (report-only; never block the build/deploy jobs) -----------------
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Exclude goldens — they're pixel-pinned and render differently across
      # machines (fonts/GPU), so they're flaky on CI runners. They run locally
      # (`flutter test`); see test/golden/ and dart_test.yaml.
      - run: flutter test --exclude-tags golden

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Chrome + a version-matched chromedriver on PATH, which scripts/web/e2e.sh
      # needs. Pin a concrete version so Chrome and chromedriver come from the
      # same Chrome-for-Testing build — leaving it unpinned skews them (Chrome
      # 148 vs chromedriver 151), breaking the session. Bump together when aged.
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: '148'
          install-chromedriver: true
      - run: flutter pub get
      # The script defaults to --no-headless; --headless forwards last and wins.
      # ORION_E2E (set inside the script) makes the boot deterministic.
      - run: ./scripts/web/e2e.sh --headless

  # --- Build + deploy: branch (staging + previews, auto) ----------------------
  web:
    # Branch pushes only: main -> staging slot, feature/**,dev/** -> their slot.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compute deploy slot
        id: slot
        # Every branch is a /web/<slot>/ leaf: main -> slot `staging`, others ->
        # the ref with a leading `feature/` stripped (dev/** etc. keep their path).
        # Leaves are isolated, so they mirror with --delete (only the prod root
        # job below must NOT --delete — it would wipe sibling slots).
        run: |
          ref="${GITHUB_REF#refs/heads/}"
          if [ "$ref" = "main" ]; then slot="staging"; else slot="${ref#feature/}"; fi
          echo "base=/web/$slot/"               >> "$GITHUB_OUTPUT"
          echo "dir=/root/orion/site/web/$slot" >> "$GITHUB_OUTPUT"

      - name: Build web (release)
        # base-href must match the served path (else assets 404 → blank page).
        run: |
          flutter pub get
          flutter build web --release --base-href "${{ steps.slot.outputs.base }}"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.VPS_PORT }}" -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy web → VPS (and regenerate the root landing page)
        run: |
          # Marker read by gen-landing-index.sh to show the deployed commit per landing row.
          echo "${GITHUB_SHA:0:7}" > build/web/.orion-sha
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            'mkdir -p ${{ steps.slot.outputs.dir }}'
          rsync -az --delete -e "ssh -p ${{ vars.VPS_PORT }}" \
            build/web/ "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ steps.slot.outputs.dir }}/"
          scp -P "${{ vars.VPS_PORT }}" scripts/dev/remote/edge/gen-landing-index.sh \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/orion/gen-landing-index.sh"
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "bash /root/orion/gen-landing-index.sh /root/orion/site"

  # --- Build + deploy: prod (tag, GATED) --------------------------------------
  web-prod:
    # Version tag `v*` -> the prod root /web/. `environment: production` is the
    # required-reviewer gate: the run pauses here until approved in the repo UI.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web (release)
        # Prod is served at the root, so base-href is /web/.
        run: |
          flutter pub get
          flutter build web --release --base-href "/web/"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.VPS_PORT }}" -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy web → VPS prod root (and regenerate the landing page)
        # The root must NOT use --delete: it would wipe the sibling staging/preview
        # slot dirs that live under site/web/.
        run: |
          echo "${GITHUB_SHA:0:7}" > build/web/.orion-sha
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            'mkdir -p /root/orion/site/web'
          rsync -az -e "ssh -p ${{ vars.VPS_PORT }}" \
            build/web/ "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/orion/site/web/"
          scp -P "${{ vars.VPS_PORT }}" scripts/dev/remote/edge/gen-landing-index.sh \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/orion/gen-landing-index.sh"
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "bash /root/orion/gen-landing-index.sh /root/orion/site"

  apk:
    # Branch pushes only: main -> apk/staging, feature/**,dev/** -> apk/<slot>.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compute deploy slot
        id: slot
        # main -> site/apk/staging (keep 3) ; others -> site/apk/<slot> (feature/
        # stripped, keep 1). APK never uses --delete (versioned builds accumulate);
        # the index is regenerated per dir.
        run: |
          ref="${GITHUB_REF#refs/heads/}"
          if [ "$ref" = "main" ]; then slot="staging"; keep=3; else slot="${ref#feature/}"; keep=1; fi
          echo "dir=/root/orion/site/apk/$slot" >> "$GITHUB_OUTPUT"
          echo "keep=$keep"                     >> "$GITHUB_OUTPUT"

      - name: Build APK (release)
        # ubuntu-latest ships the Android SDK; flutter build apk uses it.
        run: |
          flutter pub get
          flutter build apk --release

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.VPS_PORT }}" -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy APK → VPS (versioned, prune old, regenerate index)
        # Versioned name app-<YYMMDD-HHMMSS>-<sha7>.apk (date-first so ls -t sorts correctly).
        # After upload, prune oldest beyond KEEP, then regenerate the index.
        run: |
          SHA="$(git rev-parse --short=7 HEAD)"
          STAMP="$(date +%y%m%d-%H%M%S)"
          NAME="app-$STAMP-$SHA.apk"
          DIR="${{ steps.slot.outputs.dir }}"
          KEEP="${{ steps.slot.outputs.keep }}"
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" "mkdir -p $DIR"
          scp -P "${{ vars.VPS_PORT }}" scripts/dev/remote/edge/gen-apk-index.sh \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/orion/gen-apk-index.sh"
          scp -P "${{ vars.VPS_PORT }}" build/app/outputs/flutter-apk/app-release.apk \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:$DIR/$NAME"
          scp -P "${{ vars.VPS_PORT }}" scripts/dev/remote/edge/gen-landing-index.sh \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/orion/gen-landing-index.sh"
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "ls -t $DIR/*.apk 2>/dev/null | tail -n +\$(( $KEEP + 1 )) | xargs -r rm -f && bash /root/orion/gen-apk-index.sh $DIR && bash /root/orion/gen-landing-index.sh /root/orion/site"

  # --- Build + deploy: prod APK (tag, GATED) ----------------------------------
  apk-prod:
    # Version tag `v*` -> the prod root apk/. Same gate as web-prod.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK (release)
        run: |
          flutter pub get
          flutter build apk --release

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.VPS_PORT }}" -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy APK → VPS prod root (versioned, prune old, regenerate index)
        run: |
          SHA="$(git rev-parse --short=7 HEAD)"
          STAMP="$(date +%y%m%d-%H%M%S)"
          NAME="app-$STAMP-$SHA.apk"
          DIR="/root/orion/site/apk"
          KEEP=3
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" "mkdir -p $DIR"
          scp -P "${{ vars.VPS_PORT }}" scripts/dev/remote/edge/gen-apk-index.sh \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/orion/gen-apk-index.sh"
          scp -P "${{ vars.VPS_PORT }}" build/app/outputs/flutter-apk/app-release.apk \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:$DIR/$NAME"
          scp -P "${{ vars.VPS_PORT }}" scripts/dev/remote/edge/gen-landing-index.sh \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/orion/gen-landing-index.sh"
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "ls -t $DIR/*.apk 2>/dev/null | tail -n +\$(( $KEEP + 1 )) | xargs -r rm -f && bash /root/orion/gen-apk-index.sh $DIR && bash /root/orion/gen-landing-index.sh /root/orion/site"
