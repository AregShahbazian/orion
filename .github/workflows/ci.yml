# Orion CI — one workflow to test, build, and deploy on every push.
#
# Four independent jobs — none gates another, so a red test never blocks a
# deploy (detection, not prevention; branch protection isn't available on this
# private repo anyway):
#   unit     — flutter test (unit + widget)
#   web-e2e  — headless web integration_test suite (scripts/web/e2e.sh)
#   web      — build release web  + deploy to VPS
#   apk      — build release APK  + deploy to VPS
#
# Deploy targets:
#   Prod:    push to `main`                      -> /web/        and /apk/
#   Preview: push to `feature/**` or `dev/**`    -> /web/<slot>/ and /apk/<slot>/
#            (`feature/` is stripped; other refs keep their path, e.g.
#             dev/testing -> /web/dev/testing/).
#
# Required GitHub config (Settings → Secrets and variables → Actions):
#   Secret    VPS_SSH_KEY   private half of the CI deploy key
#   Variables VPS_HOST / VPS_USER / VPS_PORT
# Deploy root on the VPS: /root/orion/site/{web,apk}/  (served by Caddy — see deploy/).

name: ci

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'dev/**'
  workflow_dispatch: {}

concurrency:
  # Per-branch: a new push supersedes an in-flight run of the same branch only.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Tests (report-only; never block the build/deploy jobs) -----------------
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Exclude goldens — they're pixel-pinned and render differently across
      # machines (fonts/GPU), so they're flaky on CI runners. They run locally
      # (`flutter test`); see test/golden/ and dart_test.yaml.
      - run: flutter test --exclude-tags golden

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Chrome + a version-matched chromedriver on PATH, which scripts/web/e2e.sh
      # needs. Pin a concrete version so Chrome and chromedriver come from the
      # same Chrome-for-Testing build — leaving it unpinned skews them (Chrome
      # 148 vs chromedriver 151), breaking the session. Bump together when aged.
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: '148'
          install-chromedriver: true
      - run: flutter pub get
      # The script defaults to --no-headless; --headless forwards last and wins.
      # ORION_E2E (set inside the script) makes the boot deterministic.
      - run: ./scripts/web/e2e.sh --headless

  # --- Build + deploy ---------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compute deploy slot
        id: slot
        # main -> served at /web/ (dir site/web), no slot. Others -> /web/<slot>/,
        # where slot is the ref with a leading `feature/` stripped (dev/** etc.
        # keep their path). Preview dirs are isolated leaves, so they mirror with
        # --delete; main must NOT use --delete (it would wipe sibling previews).
        run: |
          ref="${GITHUB_REF#refs/heads/}"
          if [ "$ref" = "main" ]; then
            echo "base=/web/"                    >> "$GITHUB_OUTPUT"
            echo "dir=/root/orion/site/web"      >> "$GITHUB_OUTPUT"
            echo "delete="                       >> "$GITHUB_OUTPUT"
          else
            slot="${ref#feature/}"
            echo "base=/web/$slot/"              >> "$GITHUB_OUTPUT"
            echo "dir=/root/orion/site/web/$slot" >> "$GITHUB_OUTPUT"
            echo "delete=--delete"               >> "$GITHUB_OUTPUT"
          fi

      - name: Build web (release)
        # base-href must match the served path (else assets 404 → blank page).
        run: |
          flutter pub get
          flutter build web --release --base-href "${{ steps.slot.outputs.base }}"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.VPS_PORT }}" -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy web → VPS (and regenerate the root landing page)
        run: |
          # Marker read by gen-landing-index.sh to show the deployed commit per landing row.
          echo "${GITHUB_SHA:0:7}" > build/web/.orion-sha
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            'mkdir -p ${{ steps.slot.outputs.dir }}'
          rsync -az ${{ steps.slot.outputs.delete }} -e "ssh -p ${{ vars.VPS_PORT }}" \
            build/web/ "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ steps.slot.outputs.dir }}/"
          scp -P "${{ vars.VPS_PORT }}" deploy/gen-landing-index.sh \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/orion/gen-landing-index.sh"
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "bash /root/orion/gen-landing-index.sh /root/orion/site"

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compute deploy slot
        id: slot
        # main -> site/apk ; others -> site/apk/<slot> (feature/ stripped). APK never
        # uses --delete (versioned builds accumulate); the index is regenerated per dir.
        run: |
          ref="${GITHUB_REF#refs/heads/}"
          if [ "$ref" = "main" ]; then
            echo "dir=/root/orion/site/apk"       >> "$GITHUB_OUTPUT"
            echo "keep=3"                          >> "$GITHUB_OUTPUT"
          else
            echo "dir=/root/orion/site/apk/${ref#feature/}" >> "$GITHUB_OUTPUT"
            echo "keep=1"                          >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK (release)
        # ubuntu-latest ships the Android SDK; flutter build apk uses it.
        run: |
          flutter pub get
          flutter build apk --release

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.VPS_PORT }}" -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy APK → VPS (versioned, prune old, regenerate index)
        # Versioned name app-<YYMMDD-HHMMSS>-<sha7>.apk (date-first so ls -t sorts correctly).
        # After upload, prune oldest beyond KEEP, then regenerate the index.
        run: |
          SHA="$(git rev-parse --short=7 HEAD)"
          STAMP="$(date +%y%m%d-%H%M%S)"
          NAME="app-$STAMP-$SHA.apk"
          DIR="${{ steps.slot.outputs.dir }}"
          KEEP="${{ steps.slot.outputs.keep }}"
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" "mkdir -p $DIR"
          scp -P "${{ vars.VPS_PORT }}" deploy/gen-apk-index.sh \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/orion/gen-apk-index.sh"
          scp -P "${{ vars.VPS_PORT }}" build/app/outputs/flutter-apk/app-release.apk \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:$DIR/$NAME"
          scp -P "${{ vars.VPS_PORT }}" deploy/gen-landing-index.sh \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/orion/gen-landing-index.sh"
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "ls -t $DIR/*.apk 2>/dev/null | tail -n +\$(( $KEEP + 1 )) | xargs -r rm -f && bash /root/orion/gen-apk-index.sh $DIR && bash /root/orion/gen-landing-index.sh /root/orion/site"
