<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Orion — GPS tracking and offline maps.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Orion">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- MapLibre GL JS — required for maplibre_gl on web (version per plugin 0.26.1) -->
  <script src='https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.js'></script>
  <link href='https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css' rel='stylesheet'/>

  <!-- The maplibre_gl plugin creates its AttributionControl without `compact`,
       so the attribution renders as a full-width bar (responsive: expanded
       >640px) that collides with our bottom-right HUD FAB. Force `compact: true`
       on every instance so it always collapses to the fixed-size "ⓘ"
       (expandable on click) — the FAB then needs only a fixed lift to clear it.
       Patch the prototype's onAdd (the namespace export may be read-only, so we
       can't swap the constructor) and flip the flag before maplibre lays it out.
       Must run after maplibre-gl.js, before flutter_bootstrap.js builds the map. -->
  <script>
    (function () {
      var ctrl = window.maplibregl && window.maplibregl.AttributionControl;
      if (!ctrl || !ctrl.prototype) return;
      var origOnAdd = ctrl.prototype.onAdd;
      ctrl.prototype.onAdd = function (map) {
        this.options = this.options || {};
        this.options.compact = true;
        var el = origOnAdd.call(this, map); // the attribution container <div>
        // maplibre force-expands (open + compact-show) the first time it turns
        // compact on — which happens when the attributions finish loading, after
        // onAdd returns. Collapse once on the map's first idle; later user clicks
        // still expand normally (compact class is then set, so it isn't redone).
        var collapse = function () {
          if (!el || !el.classList) return;
          el.removeAttribute('open');
          el.classList.remove('maplibregl-compact-show');
        };
        collapse();
        if (map && map.once) map.once('idle', collapse);
        return el;
      };
    })();
  </script>

  <style>
    /* Orion drives location from its own Flutter HUD FAB; hide MapLibre's
       built-in geolocate control so web doesn't show two overlapping location
       icons. The control still exists (our FAB triggers it programmatically),
       so the dot + accuracy circle remain. */
    .maplibregl-ctrl-geolocate { display: none !important; }
  </style>

  <title>Orion</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
